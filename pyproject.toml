[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-map"
version = "0.1.0"
description = "Passive, privacy-conscious WLAN survey with GPS and a local map"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
wifi-map = "wifi_map.cli:main"

[tool.setuptools.package-data]
wifi_map = ["static/*"]
